name: Build Linux artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked
      - run: cargo +stable build --locked --release
      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/mihomo-top LICENSE README.md dist/
          tar -C dist -czf mihomo-top-linux-x86_64.tar.gz mihomo-top LICENSE README.md
          sha256sum mihomo-top-linux-x86_64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mihomo-top-linux-x86_64
          path: |
            mihomo-top-linux-x86_64.tar.gz
            SHA256SUMS
          if-no-files-found: error
