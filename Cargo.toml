[package]
name = "mihomo-top"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
description = "Read-only Linux connection monitor for mihomo with process and tmux attribution"
license = "MIT"
repository = "https://github.com/HsinyuanZhang/mihomo-top"
readme = "README.md"
keywords = ["mihomo", "monitoring", "terminal", "linux", "tmux"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "README.zh-CN.md", "LICENSE", "docs/**", "examples/**", "CHANGELOG.md"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
rustix = { version = "0.38", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"
tungstenite = "0.26"

[profile.release]
lto = "thin"
strip = true
